        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CouponTemplateListItem:
      type: object
      description: Console list representation (served by the admin/store representative list handler; note totalStock/issuedCount rather than stockQuantity/issuedQuantity).
      properties:
        id: { type: integer, format: int64 }
        scopeType: { type: string, enum: [global, store] }
        storeId: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        couponType: { type: string, enum: [exchange, discount, cash] }
        valueCent: { type: integer, format: int64 }
        pointsPrice: { type: integer, format: int64 }
        totalStock: { type: integer, format: int64 }
        stockQuantity: { type: integer, format: int64 }
        issuedCount: { type: integer, format: int64 }
        issuedQuantity: { type: integer, format: int64 }
        perMemberLimit: { type: integer, format: int64 }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CouponTemplateInput:
      type: object
      required: [name, couponType]
      properties:
        name: { type: string }
        description: { type: string }
        couponType: { type: string, enum: [exchange, discount, cash] }
        valueCent: { type: integer, format: int64 }
        pointsPrice: { type: integer, format: int64 }
        stockQuantity: { type: integer, format: int64 }
        perMemberLimit: { type: integer, format: int64 }
    CouponApplicableItemsView:
      type: object
      properties:
        templateId: { type: integer, format: int64 }
        itemIds: { type: array, items: { type: integer, format: int64 } }
        categoryIds: { type: array, items: { type: integer, format: int64 } }
    # ---- console entitlement actions ----
    CouponGrantRequest:
      type: object
      required: [templateId, memberId]
      properties:
        templateId: { type: integer, format: int64 }
        memberId: { type: integer, format: int64 }
        reason: { type: string }
    CouponVoidRequest:
      type: object
      required: [entitlementId]
      properties:
        entitlementId: { type: integer, format: int64 }
        reason: { type: string }
    CouponVerifyRequest:
      type: object
      required: [storeId]
      description: Provide entitlementId or entitlementNo. On the store console the storeId is overridden by the token scope.
      properties:
        entitlementNo: { type: string }
        entitlementId: { type: integer, format: int64 }
        storeId: { type: integer, format: int64 }
    CouponEntitlementView:
      type: object
      properties:
        entitlementId: { type: integer, format: int64 }
        entitlementNo: { type: string }
        status: { type: string, enum: [active, used, void, expired] }
    # ---- reservation / waitlist / availability views ----
    TableView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        capacity: { type: integer }
        layoutUrl: { type: string, description: Optional custom table background URL }
        status: { type: string }
    SeatView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        tableId: { type: integer, format: int64 }
        name: { type: string }
        status: { type: string }
        nickname: { type: string, description: Present when the seat is reserved }
        avatarUrl: { type: string, description: Reserved member avatar URL }
        gender: { type: string, enum: [male, female, other], description: Reserved member gender }
    ReservationView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        reservationNo: { type: string }
        storeId: { type: integer, format: int64 }
        tableId: { type: integer, format: int64 }
        seatId: { type: integer, format: int64 }
        partySize: { type: integer }
        reservedAt: { type: string, format: date-time, description: Server-recorded reservation creation time retained for compatibility; not an arrival time }
        status: { type: string, enum: [booked] }
        remark: { type: string }
        memberNickname: { type: string }
        memberPhone: { type: string }
        memberAvatarUrl: { type: string }
        tableNo: { type: string }
        seatNo: { type: string }
        createdAt: { type: string, format: date-time }
    CreateReservationRequest:
      type: object
      required: [storeId, tableId, seatId, partySize]
      properties:
        storeId: { type: integer, format: int64 }
        tableId: { type: integer, format: int64 }
        seatId: { type: integer, format: int64 }
        partySize: { type: integer }
        remark: { type: string }
    WaitlistEntryView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        storeId: { type: integer, format: int64 }
        partySize: { type: integer }
        status: { type: string, enum: [waiting, called, seated, left] }
        queuedAt: { type: string, format: date-time }
    CreateWaitlistRequest:
      type: object
      required: [storeId, partySize]
      properties:
        storeId: { type: integer, format: int64 }
        partySize: { type: integer }
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, default: 20, maximum: 100 }
    StoreID:
      name: storeID
      in: path
      required: true
      schema: { type: integer, format: int64 }
    MemberID:
      name: memberID
      in: path
      required: true
      schema: { type: integer, format: int64 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
    ReportFrom:
      name: from
      in: query
      description: >
        Inclusive lower bound of the report window (RFC3339 datetime or
        YYYY-MM-DD date). Ignored if unparseable.
      schema: { type: string }
    ReportTo:
      name: to
      in: query
      description: >
        Inclusive upper bound of the report window (RFC3339 datetime or
        YYYY-MM-DD date). Ignored if unparseable.
      schema: { type: string }
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    PointReviewSettings:
      type: object
      required: [pointsDivisor, coinPointsDivisor, version]
      properties:
        pointsDivisor: { type: integer, format: int64, minimum: 1, description: 'Raw points divided by this value for the standard awarded-points calculation' }
        coinPointsDivisor: { type: integer, format: int64, minimum: 1, description: 'Coin-base points divided by this value; integer result is credited as coins' }
        version: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }
    UpdatePointReviewSettingsRequest:
      type: object
      required: [pointsDivisor, coinPointsDivisor]
      properties:
        pointsDivisor: { type: integer, format: int64, minimum: 1 }
        coinPointsDivisor: { type: integer, format: int64, minimum: 1 }
    GlobalSettings:
      type: object
      required: [tableDefaultBackgroundUrl, firstRechargeDoublePointsEnabled, rechargeDoublePointsThresholdAmount, franchiseInquirySources, franchiseHotline]
      properties:
        tableDefaultBackgroundUrl:
          type: string
          format: uri
          description: 'Fallback image URL used when a table has no custom background; empty string disables the fallback'
        firstRechargeDoublePointsEnabled:
          type: boolean
          description: 'Whether a member platform-wide first successful recharge grants points equal to twice the credited coins'
        rechargeDoublePointsThresholdAmount:
          type: integer
          format: int64
          minimum: 1
          description: 'Recharge amount in yuan that activates the high-value double-points reward and excludes the first-recharge reward'
        franchiseInquirySources:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, maxLength: 20 }
          description: 'Source options rendered by the public franchise inquiry form'
        franchiseHotline:
          type: string
          maxLength: 32
          description: 'Headquarters franchise hotline rendered above the public form'
        updatedAt: { type: string, format: date-time }
    UpdateGlobalSettingsRequest:
      type: object
      required: [tableDefaultBackgroundUrl, firstRechargeDoublePointsEnabled, rechargeDoublePointsThresholdAmount, franchiseInquirySources, franchiseHotline]
      properties:
        tableDefaultBackgroundUrl:
          type: string
          maxLength: 2048
          description: 'HTTP(S) image URL, or an empty string to clear the default'
        firstRechargeDoublePointsEnabled:
          type: boolean
        rechargeDoublePointsThresholdAmount:
          type: integer
          format: int64
          minimum: 1
        franchiseInquirySources:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, maxLength: 20 }
        franchiseHotline: { type: string, maxLength: 32 }
    FranchiseInquiry:
      type: object
      required: [id, contactName, phone, expectedRegion, source, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        contactName: { type: string }
        phone: { type: string }
        expectedRegion: { type: string }
        source: { type: string }
        status: { type: string, enum: [unprocessed, processed] }
        processedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    CreateFranchiseInquiryRequest:
      type: object
      required: [contactName, phone, expectedRegion, source]
      properties:
        contactName: { type: string, maxLength: 50 }
        phone: { type: string, minLength: 6, maxLength: 32 }
        expectedRegion: { type: string, maxLength: 100 }
        source: { type: string, maxLength: 20 }
    ReviewPointSavingRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        remark: { type: string, maxLength: 255 }
    PointSavingReviewResult:
      type: object
      properties:
        id: { type: integer, format: int64 }
        memberId: { type: integer, format: int64 }
        points: { type: integer, format: int64, description: 'Original requested points S' }
        basePoints: { type: integer, format: int64, description: 'Approved withdrawal base B in the frozen business window' }
        excessPoints: { type: integer, format: int64, description: 'Points above the base E' }
        awardedPoints: { type: integer, format: int64, description: 'Actual points credited A' }
        coinBasePoints: { type: integer, format: int64 }
        awardedCoins: { type: integer, format: int64 }
        ruleVersion: { type: integer, format: int64 }
        pointsDivisor: { type: integer, format: int64 }
        coinPointsDivisor: { type: integer, format: int64 }
        calculationDescription: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        reviewedBy: { type: integer, format: int64 }
        reviewedAt: { type: string, format: date-time }

paths:
  /api/v2/mini/franchise-inquiries/config:
    get:
      tags: [mini]
      summary: Get configurable franchise inquiry sources
      responses:
        '200':
          description: franchise inquiry form configuration
  /api/v2/mini/franchise-inquiries:
    post:
      tags: [mini]
      summary: Submit a franchise inquiry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFranchiseInquiryRequest' }
      responses:
        '201':
          description: created inquiry
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/FranchiseInquiry' }
        '400': { $ref: '#/components/responses/Error' }
  /api/v2/admin/franchise-inquiries:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: List franchise inquiries
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: keyword, in: query, description: 'Fuzzy search contact name, phone or expected region', schema: { type: string } }
        - { name: source, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [unprocessed, processed] } }
      responses:
        '200': { description: paginated inquiry list }
        '401': { $ref: '#/components/responses/Error' }
  /api/v2/admin/franchise-inquiries/{inquiryID}/status:
    patch:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Update franchise inquiry processing status
      parameters:
        - { name: inquiryID, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [unprocessed, processed] }
      responses:
        '200': { description: status updated }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v2/admin/global-settings:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Get headquarters global presentation settings
      responses:
        '200':
          description: current global settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/GlobalSettings' }
        '401': { $ref: '#/components/responses/Error' }
    put:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Update headquarters global presentation settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateGlobalSettingsRequest' }
      responses:
        '200':
          description: updated global settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/GlobalSettings' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v2/admin/point-review-settings:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Get the global staff point-review ratios
      responses:
        '200':
          description: current settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PointReviewSettings' }
    put:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      summary: Update the global staff point-review ratios
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePointReviewSettingsRequest' }
      responses:
        '200':
          description: updated settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PointReviewSettings' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v2/mini/staff/point-savings/{requestID}/review:
    post:
      tags: [mini]
      security: [{ bearerAuth: [] }]
      summary: Approve or reject a point-saving request for the staff member's store
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - name: requestID
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewPointSavingRequest' }
      responses:
        '200':
          description: reviewed request and frozen calculation snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PointSavingReviewResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /internal/health:
    get:
      tags: [internal]
      summary: Liveness probe
      responses:
        '200': { description: ok }
  /internal/ready:
    get:
      tags: [internal]
      summary: Readiness probe (pings MySQL)
      responses:
        '200': { description: ok }
  /internal/qiniu/upload-callback:
    post:
      tags: [internal]
      summary: Qiniu upload callback (signature-verified, no JWT)
      responses:
        '200': { description: asset marked uploaded }
        '401': { $ref: '#/components/responses/Error' }
  /internal/payments/wechat/notify:
    post:
      tags: [internal]
      summary: WeChat Pay unified notify (signature-verified, no JWT)
      description: >
        Single callback for all WeChat business types; the payment order is
        located by out_trade_no. The real gateway verifies the
        Wechatpay-Signature against the configured platform public key
        (Wechatpay-Serial must match WECHAT_PAY_PUBLIC_KEY_ID), rejects a
        timestamp outside a 5-minute window (replay guard), then decrypts the
        AEAD_AES_256_GCM resource with the APIv3 key. Verified, idempotent
        settlement: a non-SUCCESS trade_state is acknowledged without changing
        state, and a duplicate notify for an already-paid order succeeds without
        re-applying state. A verification failure returns 401 so WeChat retries.
        For a member-bound recharge order the settlement also grants the top-up
        entitlement in the same transaction: a configured quick-recharge tier
        credits its coinAmount and pointsAmount, while a custom amount credits
        one coin per paid yuan. The settlement also accrues the internal
        growth-value grant and advances the member's VIP tier for the new growth
        balance (upgrade-only). Each entitlement carries its own idem key, so
        replays never double-credit.
      responses:
        '200': { description: settled (or idempotent no-op) }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /internal/payments/offline-acquirer/notify:
    post:
      tags: [internal]
      summary: Offline aggregated-collection acquirer notify (signature-verified, no JWT)
      description: >
        Acquirer callback for offline collection codes. The acquirer supplies the
        paying channel (wechat/alipay), external trade no and amount; the server
        never identifies the payer. Settlement locks the payment order and its
        collection order, advances both to paid exactly once, and (for a
        member-bound collection) writes a payment:post-process outbox event for
        asynchronous entitlement evaluation. A cancelled or expired collection is
        never resurrected to paid; duplicate notifies are idempotent.
      responses:
        '200': { description: settled (or idempotent no-op) }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v2/mini/auth/wechat/login:
    post:
      tags: [mini]
      summary: WeChat mini-program login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: { code: { type: string } }
      responses:
        '200':
          description: token + profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { $ref: '#/components/schemas/TokenPair' }
                      profile: { type: object }
                      subjectType: { type: string, enum: [member, staff] }
                      storeId: { type: integer, format: int64, description: Present for staff }
  /api/v2/mini/auth/refresh:
    post:
      tags: [mini]
      summary: Refresh a mini token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: { refreshToken: { type: string } }
      responses:
        '200': { description: new token pair }
  /api/v2/mini/auth/logout:
    post:
      tags: [mini]
      security: [{ bearerAuth: [] }]
      summary: Logout (bumps token version)
      description: >-
        Bumps the member's token_version. This invalidates the refresh token and
        every outstanding access token immediately: any subsequent request with a
        pre-logout access token is rejected with 401 (session expired).
      responses:
        '200': { description: ok }
  /api/v2/mini/me:
    get:
      tags: [mini]
      security: [{ bearerAuth: [] }]
      summary: Current member profile
      responses:
        '200':
          description: member profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MemberProfile' }
  /api/v2/mini/assets/upload-credentials:
    post:
      tags: [mini]
      security: [{ bearerAuth: [] }]
      summary: Issue a scoped Qiniu upload token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadCredentialRequest' }
      responses:
        '200':
          description: upload credential
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UploadCredential' }
  /api/v2/mini/stores:
    get:
      tags: [mini]
      summary: List active stores (optional lat/lng for distance)
      parameters:
        - { name: lat, in: query, schema: { type: number } }
        - { name: lng, in: query, schema: { type: number } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: store list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/StoreView' } }
                  meta: { $ref: '#/components/schemas/Meta' }
  /api/v2/mini/stores/{storeID}:
    get:
      tags: [mini]
      summary: Store detail
      parameters: [{ $ref: '#/components/parameters/StoreID' }]
      responses:
        '200': { description: store detail }
        '404': { $ref: '#/components/responses/Error' }
  /api/v2/mini/stores/{storeID}/banners:
    get:
      tags: [mini]
      summary: Store banners
      parameters: [{ $ref: '#/components/parameters/StoreID' }]
      responses:
        '200': { description: banner list }
  /api/v2/mini/stores/{storeID}/catalog/categories:
    get:
      tags: [mini]
      summary: Store catalog categories
      parameters: [{ $ref: '#/components/parameters/StoreID' }]
      responses:
        '200': { description: category list }
  /api/v2/mini/stores/{storeID}/catalog/items:
    get:
      tags: [mini]
      summary: Store catalog items
      parameters:
        - { $ref: '#/components/parameters/StoreID' }
        - { name: categoryId, in: query, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: item list }
  /api/v2/mini/stores/{storeID}/activities:
    get:
      tags: [mini]
      summary: Activities for a store
      parameters:
        - { $ref: '#/components/parameters/StoreID' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: scope, in: query, schema: { type: string, enum: [history] }, description: Return activities whose end time is in the past }
      responses:
        '200': { description: activity list }
  /api/v2/mini/activities:
    get:
      tags: [mini]
      summary: List published activities
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: scope, in: query, schema: { type: string, enum: [history] }, description: Return activities whose end time is in the past }
      responses:
        '200': { description: activity list }
  /api/v2/mini/activities/{activityID}:
    get:
      tags: [mini]
      summary: Activity detail (includes sellable ticket types)
      parameters:
        - { name: activityID, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: activity detail with its sellable ticket types
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ActivityView' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v2/mini/membership-tiers:
    get:
      tags: [mini]
      summary: List active membership (VIP) tiers
      responses:
        '200':
          description: membership tier list (active only, ascending by level)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/MembershipTierView' } }
  /api/v2/mini/recharge-products:
    get:
      tags: [mini]
      summary: List active recharge products
      responses:
        '200':
          description: recharge product list (active only, ascending by sortOrder)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/RechargeProductView' } }
  /api/v2/mini/rankings:
    get:
      tags: [mini]
      summary: Leaderboard of approved point savings
      parameters:
        - name: period
          in: query
          description: 'Window: week, month or all (default all)'
          schema: { type: string, enum: [week, month, all] }
