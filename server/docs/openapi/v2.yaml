  /api/v2/mini/sign-ins/status:
    get:
      tags: [mini]
      security: [{ bearerAuth: [] }]
      summary: Get today's sign-in state and reward preview
      responses:
        '200':
          description: current sign-in state
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SignInStatus' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v2/mini/sign-ins:
    post:
      tags: [mini]
      security: [{ bearerAuth: [] }]
      summary: Daily sign-in (awards streak-based points)
      description: >
        Records the member's sign-in for the current business day and credits the
        streak reward to the points wallet in one transaction. The reward ladder
        is the enabled sign_in rule — rewards grow day 1..7 = 100..700 by default,
        capped from day 7 onward — and is configurable from the admin console
        (`/admin/rule-definitions`, ruleKey=sign_in; see SignInRuleConfig). A
        second sign-in on the same day is an idempotent no-op that echoes the
        existing award. The member is taken from the token, never the body.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '201':
          description: sign-in recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SignInResult' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
