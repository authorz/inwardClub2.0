        '409': { $ref: '#/components/responses/Error' }

  /api/v2/mini/food-orders:
    get:
      tags: [mini]
      security: [{ bearerAuth: [] }]
      summary: List the member's food orders (newest first)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: food order page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/FoodOrderView' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [mini]
      security: [{ bearerAuth: [] }]
      summary: Place a food order (creates business + food + pending payment order)
      description: >
        Snapshots each line's price/name from the catalog inside one transaction,
        creating the business order, the food order with its lines and a pending
        payment_order. The member is taken from the token, never the body; the
        Idempotency-Key guards against duplicate placement. The response carries
        paymentOrderId so the client can continue via the payment endpoints.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFoodOrderRequest' }
      responses:
        '201':
          description: food order created (payable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/FoodOrderView' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v2/mini/food-orders/{orderID}:
    get:
      tags: [mini]
      security: [{ bearerAuth: [] }]
      summary: Food order detail with lines (scoped to the member)
      parameters:
        - { name: orderID, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: food order detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/FoodOrderView' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v2/mini/recharge-orders:
    get:
      tags: [mini]
      security: [{ bearerAuth: [] }]
      summary: List the member's recharge (top-up) orders
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: recharge order page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/RechargeOrderView' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [mini]
      security: [{ bearerAuth: [] }]
      summary: Create a wallet top-up order (creates a pending payment order)
      description: >
        Creates a recharge business_order (order_type=recharge) and a pending
        payment_order for the requested amount in one transaction. Bonus tiers are
        applied on settlement (payment callback), not here. The response carries
        paymentOrderId for the payment step.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRechargeOrderRequest' }
      responses:
        '201':
          description: recharge order created (payable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RechargeOrderView' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v2/mini/recharge-orders/{orderID}:
    get:
      tags: [mini]
      security: [{ bearerAuth: [] }]
      summary: Recharge order detail (scoped to the member)
      parameters:
        - { name: orderID, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: recharge order detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RechargeOrderView' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v2/mini/activity-orders:
    get:
      tags: [mini]
      security: [{ bearerAuth: [] }]
      summary: List the member's activity (ticket) orders
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: activity order page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ActivityOrderView' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [mini]
      security: [{ bearerAuth: [] }]
      summary: Buy activity tickets (reserves stock, issues tickets, payable)
      description: >
        Reserves ticket-type stock, issues one ticket instance per quantity with a
        verification code, and creates the business + activity + pending payment
        order in one transaction. Insufficient stock returns 409. The response
        carries the issued tickets and paymentOrderId.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateActivityOrderRequest' }
      responses:
        '201':
          description: activity order created (payable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ActivityOrderView' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v2/mini/activity-orders/{orderID}:
    get:
      tags: [mini]
      security: [{ bearerAuth: [] }]
      summary: Activity order detail with its tickets (scoped to the member)
      parameters:
        - { name: orderID, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: activity order detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ActivityOrderView' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v2/mini/payment-orders/{paymentOrderID}/wechat-jsapi:
    post:
      tags: [mini]
      security: [{ bearerAuth: [] }]
      summary: Start a WeChat JSAPI payment for a pending payment order
      description: >
        Returns prepay parameters for wx.requestPayment. The payment order must
        belong to the member, still be pending and have payMethod=wechat. This
        never settles the order — settlement is driven by the WeChat notify
        callback owned by the payment module.
      parameters:
        - { name: paymentOrderID, in: path, required: true, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: prepay parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/WeChatJSAPIResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v2/mini/payment-orders/{paymentOrderID}/pay-by-coin:
    post:
      tags: [mini]
      security: [{ bearerAuth: [] }]
      summary: Pay a pending payment order from the member's coin balance
      description: >
        Debits the coin wallet, appends the ledger entry, records the payment
        transaction and flips the payment + business order to paid, all in one
        idempotent transaction. Requires payMethod=coin and sufficient balance
        (else 402/INSUFFICIENT_BALANCE). A retry with the same Idempotency-Key
        never double-debits.
      parameters:
        - { name: paymentOrderID, in: path, required: true, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: paid }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '402': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
