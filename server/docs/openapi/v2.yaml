        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CouponVoidRequest' }
      responses:
        '200':
          description: Voided entitlement
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CouponEntitlementView' }
        default: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v2/store/coupon-verifications:
    post:
      tags: [store]
      summary: Verify/redeem an entitlement at this store
      description: Store-bound entitlements can only be redeemed by their owning store; the store scope comes from the token.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CouponVerifyRequest' }
      responses:
        '200':
          description: Redeemed entitlement
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CouponEntitlementView' }
        default: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ------------------------------------------------------ store console: reservations & arrival
  /api/v2/store/reservations:
    get:
      tags: [store]
      summary: List this store's reservations
      description: Results are limited to active bookings in the acting store (scope from the token). Cancelled and daily-cleared reservations are deleted.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, required: false, schema: { type: integer, default: 1 } }
        - { in: query, name: pageSize, required: false, schema: { type: integer, default: 20, maximum: 100 } }
        - { in: query, name: tableNo, required: false, description: Fuzzy match against table code or name, schema: { type: string } }
        - { in: query, name: seatNo, required: false, description: Fuzzy match against seat number, schema: { type: string } }
        - { in: query, name: memberNickname, required: false, description: Fuzzy match against member nickname, schema: { type: string } }
        - { in: query, name: memberPhone, required: false, description: Fuzzy match against member phone, schema: { type: string } }
      responses:
        '200':
          description: Reservation list (this store)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ReservationView' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        default: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v2/store/reservations/{reservationID}:
    get:
      tags: [store]
      summary: Get one of this store's reservations
      description: A booking outside the store scope is reported as not found.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: reservationID, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Reservation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ReservationView' }
        default: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v2/store/reservations/{reservationID}/cancel:
    post:
      tags: [store]
      summary: Cancel an active reservation in this store
      description: Deletes the active occupancy record immediately and releases the seat. The daily reservation claim remains in force.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: reservationID, required: true, schema: { type: integer, format: int64 } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      responses:
        '200': { description: Reservation cancelled and seat released }
        default: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
