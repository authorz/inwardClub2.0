paths:
  /internal/health:
    get:
      tags: [internal]
      summary: Liveness probe
      responses:
        '200': { description: ok }
  /internal/ready:
    get:
      tags: [internal]
      summary: Readiness probe (pings MySQL)
      responses:
        '200': { description: ok }
  /internal/qiniu/upload-callback:
    post:
      tags: [internal]
      summary: Qiniu upload callback (signature-verified, no JWT)
      responses:
        '200': { description: asset marked uploaded }
        '401': { $ref: '#/components/responses/Error' }
  /internal/payments/wechat/notify:
    post:
      tags: [internal]
      summary: WeChat Pay unified notify (signature-verified, no JWT)
      description: >
        Single callback for all WeChat business types; the payment order is
        located by out_trade_no. The real gateway verifies the
        Wechatpay-Signature against the configured platform public key
        (Wechatpay-Serial must match WECHAT_PAY_PUBLIC_KEY_ID), rejects a
        timestamp outside a 5-minute window (replay guard), then decrypts the
        AEAD_AES_256_GCM resource with the APIv3 key. Verified, idempotent
        settlement: a non-SUCCESS trade_state is acknowledged without changing
        state, and a duplicate notify for an already-paid order succeeds without
        re-applying state. A verification failure returns 401 so WeChat retries.
        For a member-bound recharge order the settlement also grants the top-up
        entitlement in the same transaction: it credits (amount + bonusAmount)
        coins, accrues the product's growthAmount into the growth_value wallet,
        and advances the member's VIP tier for the new growth balance
        (upgrade-only). Each entitlement carries its own idem key, so replays
        never double-credit.
      responses:
        '200': { description: settled (or idempotent no-op) }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /internal/payments/offline-acquirer/notify:
    post:
      tags: [internal]
      summary: Offline aggregated-collection acquirer notify (signature-verified, no JWT)
      description: >
        Acquirer callback for offline collection codes. The acquirer supplies the
        paying channel (wechat/alipay), external trade no and amount; the server
        never identifies the payer. Settlement locks the payment order and its
        collection order, advances both to paid exactly once, and (for a
        member-bound collection) writes a payment:post-process outbox event for
        asynchronous entitlement evaluation. A cancelled or expired collection is
        never resurrected to paid; duplicate notifies are idempotent.
      responses:
        '200': { description: settled (or idempotent no-op) }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v2/mini/auth/wechat/login:
    post:
      tags: [mini]
      summary: WeChat mini-program login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: { code: { type: string } }
      responses:
        '200':
          description: token + profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { $ref: '#/components/schemas/TokenPair' }
                      profile: { type: object }
  /api/v2/mini/auth/refresh:
    post:
      tags: [mini]
      summary: Refresh a mini token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: { refreshToken: { type: string } }
      responses:
        '200': { description: new token pair }
  /api/v2/mini/auth/logout:
    post:
      tags: [mini]
      security: [{ bearerAuth: [] }]
      summary: Logout (bumps token version)
      description: >-
        Bumps the member's token_version. This invalidates the refresh token and
        every outstanding access token immediately: any subsequent request with a
        pre-logout access token is rejected with 401 (session expired).
      responses:
        '200': { description: ok }
  /api/v2/mini/me:
    get:
      tags: [mini]
      security: [{ bearerAuth: [] }]
      summary: Current member profile
      responses:
        '200':
          description: member profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MemberProfile' }
  /api/v2/mini/assets/upload-credentials:
    post:
      tags: [mini]
      security: [{ bearerAuth: [] }]
      summary: Issue a scoped Qiniu upload token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadCredentialRequest' }
      responses:
        '200':
          description: upload credential
          content:
