  /api/v2/mini/invitations/bind:
    post:
      tags: [mini]
      security: [{ bearerAuth: [] }]
      summary: Bind the current member to an inviter (one-time)
      description: >
        Binds the authenticated member to the inviter identified by inviteCode.
        A member may bind an inviter only once and cannot bind their own code;
        the invitee is always the token subject, never the body.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
