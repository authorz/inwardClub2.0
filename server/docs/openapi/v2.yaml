openapi: 3.0.3
info:
  title: InwardClub 2.0 API
  version: 0.1.0-m0
  description: >
    Single contract for the mini-program (`/api/v2/mini`), headquarters console
    (`/api/v2/admin`), store console (`/api/v2/store`) and internal callbacks
    (`/internal`). Money is always integer cents (`*Cent`); times are RFC3339 UTC;
    images are referenced by `assetId`, never raw URLs on write. Covers health,
    the three auth flows, asset upload credentials/callback, the mini public
    reads + wallet + daily sign-in / points-savings / points-withdrawals /
    invitations, the mini transactional flows (food-orders, recharge-orders,
    activity-orders, payment-orders wechat-jsapi / pay-by-coin, tickets), the
    admin/store order center (unified read model), payment-transactions,
    payment-orders (list + detail),
    refunds/refund-orders, member detail + wallet-adjustments, wallet-ledger,
    staff/cashier account writes, the mini membership-tiers / recharge-products /
    rankings reads, admin membership-tiers + recharge-products +
    rule-definitions (configurable sign-in rules) writes, and the admin/store
    console reports (overview plus the revenue / catalog-items / activities /
    coupons / records / members / reservations / stores read models; store
    reports are pinned to the token store scope), and the admin/store catalog
    console CRUD (categories / items / variants) plus activity console CRUD
    (activities / sessions / ticket-types), the coupon surface (mini coupon
    entitlements + redemptions, admin/store coupon-template CRUD plus grant /
    void / verify entitlement actions) and the reservation / waitlist /
    availability flows (mini + store) documented per
    `COVERAGE_MATRIX.md`.
    NOTE (audited 2026-07-18): this file specs a documented SUBSET, not the full
    surface. `internal/bootstrap/router.go` registers ~254 routes and this file
    describes ~190 of them; the other ~64 (store / banner / printer
    console CRUD and assorted reads) are implemented and DB-backed but not yet
    written up here — omitted for lack of a spec, NOT because they are skeletons.
    No route documented here returns `NOT_IMPLEMENTED`. `router.go` is the
    authoritative route list; `COVERAGE_MATRIX.md` and
    `docs/acceptance/server-not-implemented-audit-2026-07-18.md` hold the
    authoritative implemented-vs-pending status. External providers (WeChat
    login/pay, offline acquirer, printer cloud) run against fakes in dev and are
    swappable to real.
servers:
  - url: /
tags:
  - name: internal
  - name: mini
  - name: admin
  - name: store

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
    Meta:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer, format: int64 }
    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresAt: { type: string, format: date-time }
        tokenType: { type: string, example: Bearer }
    UploadCredentialRequest:
      type: object
      required: [purpose, filename, contentType, sizeBytes]
      properties:
        purpose:
          type: string
          enum: [avatar, store_logo, banner, category, product, activity, table_layout, seat_layout, vip_icon, vip_banner, rich_content]
        filename: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        visibility: { type: string, enum: [public, private] }
    UploadCredential:
      type: object
      properties:
        assetId: { type: integer, format: int64 }
        objectKey: { type: string }
        uploadToken: { type: string }
        uploadUrl: { type: string }
        publicUrl: { type: string }
        expiresAt: { type: string, format: date-time }
        maxSizeBytes: { type: integer, format: int64 }
    StoreView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        logoUrl: { type: string }
        phone: { type: string }
        customerServiceQrUrl: { type: string }
        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        businessHours: { type: string }
        status: { type: string }
        distanceMeters: { type: integer, format: int64 }
    AdminTableView:
      type: object
      required: [id, storeId, storeName, name, code, capacity, seatCount, basePoints, status]
      properties:
        id: { type: integer, format: int64 }
        storeId: { type: integer, format: int64 }
        storeName: { type: string }
        name: { type: string }
        code: { type: string }
        capacity: { type: integer, minimum: 1 }
        seatCount: { type: integer, minimum: 0 }
        basePoints: { type: integer, minimum: 0 }
        layoutAssetId: { type: integer, format: int64, nullable: true }
        layoutUrl: { type: string }
        status: { type: string, enum: [available, paused, full, maintenance] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TableWriteRequest:
      type: object
      required: [storeId, name, code, capacity, basePoints, status]
      properties:
        storeId: { type: integer, format: int64, minimum: 1 }
        name: { type: string, maxLength: 64 }
        code: { type: string, maxLength: 64 }
        capacity: { type: integer, minimum: 1 }
        basePoints: { type: integer, minimum: 0 }
        layoutAssetId: { type: integer, format: int64, nullable: true }
        status: { type: string, enum: [available, paused, full, maintenance] }
    StoreTableWriteRequest:
      type: object
      description: The store is always taken from the authenticated store account.
      required: [name, code, capacity, basePoints, status]
      properties:
        name: { type: string, maxLength: 64 }
        code: { type: string, maxLength: 64 }
        capacity: { type: integer, minimum: 1 }
        basePoints: { type: integer, minimum: 0 }
        layoutAssetId: { type: integer, format: int64, nullable: true }
        status: { type: string, enum: [available, paused, full, maintenance] }
    StoreFoodOrderView:
      type: object
      required: [id, businessOrderId, status, paymentStatus, amountCent, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64, description: Food-order ID used by fulfillment actions }
        businessOrderId: { type: string, description: User-facing business order number }
        status: { type: string, enum: [pending, confirmed, preparing, ready, completed, cancelled] }
        paymentStatus: { type: string }
        payChannel: { type: string }
        amountCent: { type: integer, format: int64 }
        paidAmountCent: { type: integer, format: int64, description: Actual settled amount; reflects the 0.01 debug payment when enabled }
        paymentOrderId: { type: integer, format: int64 }
        pointsEarned: { type: integer, format: int64 }
        tableName: { type: string }
        itemsSummary: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              unitPriceCent: { type: integer, format: int64 }
              quantity: { type: integer }
              subtotalCent: { type: integer, format: int64 }
              pointsReward: { type: integer, format: int64 }
              assetId: { type: integer, format: int64 }
              imageUrl: { type: string, description: Current public image URL of the ordered catalog item }
        memberNickname: { type: string }
        memberPhone: { type: string }
        memberAvatarUrl: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminSeatView:
      type: object
      required: [id, storeId, storeName, tableId, tableName, name, status]
      properties:
        id: { type: integer, format: int64 }
        storeId: { type: integer, format: int64 }
        storeName: { type: string }
        tableId: { type: integer, format: int64 }
        tableName: { type: string }
        name: { type: string }
        status: { type: string, enum: [available, paused, full, maintenance] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SeatWriteRequest:
      type: object
      required: [tableId, name, status]
      properties:
        tableId: { type: integer, format: int64, minimum: 1 }
        name: { type: string, maxLength: 64 }
        status: { type: string, enum: [available, paused, full, maintenance] }
    BannerView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        imageUrl: { type: string }
        linkUrl: { type: string }
        sortOrder: { type: integer }
    CategoryView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        imageUrl: { type: string }
        parentId: { type: integer, format: int64 }
        sortOrder: { type: integer }
    ItemView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        categoryId: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        imageUrl: { type: string }
        itemType: { type: string, enum: [food, coupon, redeemable, physical] }
        priceCent: { type: integer, format: int64 }
        stockQuantity: { type: integer, format: int64 }
        payChannels: { type: array, items: { type: string, enum: [wechat, coin] } }
        pointsReward: { type: integer, format: int64 }
        sortOrder: { type: integer }
        status: { type: string }
    ActivityView:
      type: object
      description: >
        Public activity view. ticketTypes is present only on the detail read
        (GET /api/v2/mini/activities/{activityID}); the list reads omit it.
      properties:
        id: { type: integer, format: int64 }
        scopeType: { type: string, enum: [global, store] }
        storeId: { type: integer, format: int64 }
        storeName: { type: string }
        address: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        title: { type: string }
        description: { type: string }
        content: { type: string }
        imageUrl: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        payChannels: { type: array, items: { type: string, enum: [wechat, coin] } }
        purchaseLimit: { type: integer, description: 'Per-member purchase limit; 0 means unlimited' }
        status: { type: string }
        ticketTypes: { type: array, items: { $ref: '#/components/schemas/PublicTicketTypeView' } }
    PublicTicketTypeView:
      type: object
      description: Sellable ticket tier shown on the mini-program activity detail purchase sheet.
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        priceCent: { type: integer, format: int64 }
        stock:
          type: integer
          format: int64
          deprecated: true
          description: Legacy compatibility field; -1 means unlimited, otherwise the remaining finite quantity. Use unlimitedStock and remainingStock.
        unlimitedStock:
          type: boolean
          description: True when the configured stock quantity is 0 and sales are uncapped.
        remainingStock:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          description: Remaining finite quantity; null when unlimitedStock is true.
        saleEndAt: { type: string, format: date-time }
        payChannels: { type: array, items: { type: string, enum: [wechat, coin] } }
        maxTicketsPerOrder: { type: integer }
    WalletAccount:
      type: object
      properties:
        assetType: { type: string, enum: [points, coins, cash_balance, growth_value] }
        availableAmount: { type: integer, format: int64, description: 'Asset units; coins are integer coin counts, where 1 coin pays ¥1.' }
        heldAmount: { type: integer, format: int64, description: 'Asset units; coins are integer coin counts, where 1 coin pays ¥1.' }
    LedgerEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        assetType: { type: string }
        direction: { type: string, enum: [credit, debit] }
        amount: { type: integer, format: int64 }
        balanceAfter: { type: integer, format: int64 }
        reason: { type: string }
        sourceType: { type: string }
        createdAt: { type: string, format: date-time }
    PaymentTransactionView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        paymentOrderNo: { type: string }
        storeId: { type: integer, format: int64 }
        storeName: { type: string }
        businessOrderId: { type: integer, format: int64 }
        businessOrderNo: { type: string }
        orderType: { type: string }
        amountCent: { type: integer, format: int64 }
        payMethod: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time }
    PaymentOrderView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        paymentOrderNo: { type: string }
        storeId: { type: integer, format: int64 }
        storeName: { type: string }
        memberId: { type: integer, format: int64 }
        businessOrderId: { type: integer, format: int64 }
        businessOrderNo: { type: string }
        orderType: { type: string }
        businessStatus: { type: string }
        paymentStatus: { type: string }
        amountCent: { type: integer, format: int64 }
        payMethod: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time }
    RefundView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        refundOrderNo: { type: string }
        paymentOrderId: { type: integer, format: int64 }
        businessOrderId: { type: integer, format: int64 }
        storeId: { type: integer, format: int64 }
        storeName: { type: string }
        businessOrderNo: { type: string }
        orderAmountCent: { type: integer, format: int64 }
        memberId: { type: integer, format: int64 }
        memberNickname: { type: string }
        memberPhone: { type: string }
        memberAvatarUrl: { type: string }
        amountCent: { type: integer, format: int64 }
        channel: { type: string }
        status: { type: string, enum: [succeeded, failed] }
        reason: { type: string }
        orderCreatedAt: { type: string, format: date-time }
        operatedAt: { type: string, format: date-time }
    CreateRefundRequest:
      type: object
      required: [paymentOrderId, amountCent]
      properties:
        paymentOrderId: { type: integer, format: int64 }
        amountCent: { type: integer, format: int64 }
        reason: { type: string }
    AdminCreateRefundRequest:
      type: object
      required: [paymentOrderId, amountCent, reason, password]
      properties:
        paymentOrderId: { type: integer, format: int64 }
        amountCent: { type: integer, format: int64, description: Positive partial or full refund amount; cannot exceed the paid amount }
        reason: { type: string }
        password: { type: string, format: password, description: Current administrator login password }
    CreateCollectionOrderRequest:
      type: object
      description: >
        storeId is never accepted from the client; it is taken from the token
        scope. memberPhone is optional and used once to match a registered
        member; it is never persisted, logged or echoed back. An unmatched phone
        returns MEMBER_NOT_FOUND so the operator can retry without a member.
      required: [amountCent, subject, businessType, expiresInSeconds]
      properties:
        amountCent: { type: integer, format: int64 }
        subject: { type: string }
        businessType: { type: string }
        expiresInSeconds: { type: integer, format: int64, description: 'QR validity window; capped at 24h' }
        memberPhone: { type: string, description: 'optional; match-only, never stored' }
    CollectionOrderView:
      type: object
      description: >
        Offline aggregated collection order. member fields appear only when a
        member was bound at creation; memberNickname is the masked nickname
        returned once for operator confirmation on create and is omitted on
        reads (only the id and masked phone are persisted). qrContent is the
        acquirer's dynamic code. The paying channel (wechat/alipay) is decided by
        the acquirer callback, never guessed here.
      properties:
        id: { type: integer, format: int64 }
        collectionOrderNo: { type: string }
        storeId: { type: integer, format: int64 }
        amountCent: { type: integer, format: int64 }
        subject: { type: string }
        businessType: { type: string }
        status: { type: string, enum: [pending, paid, cancelled, expired] }
        memberId: { type: integer, format: int64 }
        memberNickname: { type: string }
        memberPhoneMasked: { type: string }
        qrContent: { type: string }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    OrderView:
      type: object
      description: >
        Unified order-center read model shared by GET /admin/orders and
        GET /store/orders. businessOrderId mirrors id; orderNo/totalCent/status
        are retained as compatibility aliases of businessOrderNo/amountCent/
        orderStatus. memberPhone is raw (HQ); memberPhoneMasked hides the middle.
      properties:
        id: { type: integer, format: int64 }
        businessOrderId: { type: integer, format: int64 }
        orderNo: { type: string }
        orderType: { type: string }
        storeId: { type: integer, format: int64 }
        storeName: { type: string }
        memberId: { type: integer, format: int64 }
        memberNickname: { type: string }
        memberPhone: { type: string }
        memberPhoneMasked: { type: string }
        memberAvatarUrl: { type: string }
        paymentOrderId: { type: integer, format: int64 }
        refundStatus: { type: string, description: Latest refund status; used to suppress duplicate refund actions }
        totalCent: { type: integer, format: int64 }
        amountCent: { type: integer, format: int64 }
        payChannel: { type: string }
        paymentStatus: { type: string }
        orderStatus: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    MemberView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        nickname: { type: string }
        phone: { type: string }
        avatarUrl: { type: string }
        gender: { type: string, enum: [male, female, other] }
        pointsBalance: { type: integer, format: int64 }
        coinsBalance: { type: integer, format: int64 }
        vipTierName: { type: string }
        vipLevel: { type: integer }
        status: { type: string }
        createdAt: { type: string, format: date-time }
    MemberDetailView:
      allOf:
        - $ref: '#/components/schemas/MemberView'
        - type: object
          properties:
            wallet: { type: array, items: { $ref: '#/components/schemas/WalletAccount' } }
    MemberVipTier:
      type: object
      description: The member's current VIP tier, with its banner URL for the home page.
      properties:
        id: { type: integer, format: int64 }
        label: { type: string, description: 'Short user-facing VIP label derived from level (e.g. "VIP1"); never the full admin tier name' }
        level: { type: integer }
        threshold: { type: integer, format: int64 }
        iconUrl: { type: string, description: 'Resolved public URL of the VIP icon asset (QINIU_PUBLIC_DOMAIN + stored object key)' }
        bannerUrl: { type: string, description: 'Resolved public URL of the VIP banner asset (QINIU_PUBLIC_DOMAIN + stored object key)' }
    MemberProfile:
      type: object
      description: Mini-program "me" payload (GET /mini/me).
      properties:
        id: { type: integer, format: int64 }
        nickname: { type: string }
        phone: { type: string }
        inviteCode: { type: string }
        status: { type: string }
        vipTier:
          allOf: [{ $ref: '#/components/schemas/MemberVipTier' }]
          nullable: true
          description: Omitted when the member is not yet ranked.
    WalletAdjustmentRequest:
      type: object
      required: [assetType, direction, amount]
      properties:
        assetType: { type: string }
        direction: { type: string, enum: [credit, debit] }
        amount: { type: integer, format: int64 }
        reason: { type: string }
    WalletAdjustmentView:
      type: object
      properties:
        assetType: { type: string }
        direction: { type: string, enum: [credit, debit] }
        amount: { type: integer, format: int64 }
        balanceAfter: { type: integer, format: int64 }
        reason: { type: string }
    WalletLedgerEntryView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        recordKey: { type: string }
        memberId: { type: integer, format: int64 }
        memberNickname: { type: string }
        memberPhone: { type: string }
        memberAvatarUrl: { type: string }
        storeId: { type: integer, format: int64 }
        storeName: { type: string }
        assetType: { type: string }
        direction: { type: string, enum: [credit, debit] }
        amount: { type: integer, format: int64 }
        balanceAfter: { type: integer, format: int64 }
        status: { type: string, enum: [completed, pending, approved, rejected] }
        reason: { type: string }
        sourceType: { type: string }
        sourceId: { type: integer, format: int64 }
        relatedOrderNo: { type: string }
        createdAt: { type: string, format: date-time }
    StaffAccountView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        memberId: { type: integer, format: int64 }
        name: { type: string }
        phone: { type: string, description: Masked member phone }
        storeId: { type: integer, format: int64 }
        storeName: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
    AdminAccountView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        displayName: { type: string }
        role: { type: string }
        isSystem: { type: boolean, description: System administrators cannot be disabled or deleted }
        storeId: { type: integer, format: int64 }
        storeName: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
    CashierCredentialView:
      allOf:
        - $ref: '#/components/schemas/AdminAccountView'
        - type: object
          properties:
            initialPassword: { type: string, description: 'One-time plaintext password, shown once' }
    MembershipTierView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        level: { type: integer }
        threshold: { type: integer, format: int64 }
        benefits: { type: string }
        iconUrl: { type: string }
        bannerPath: { type: string, description: 'Raw Qiniu object key/path stored in DB (objectKey); not a URL, not an asset id.' }
        bannerUrl: { type: string, description: 'Resolved public URL of the VIP banner (QINIU_PUBLIC_DOMAIN + bannerPath)' }
        status: { type: string }
    MembershipTierCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        level: { type: integer }
        threshold: { type: integer, format: int64 }
        benefits: { type: string }
        iconAssetId: { type: integer, format: int64 }
        bannerPath: { type: string, description: 'Uploaded VIP banner object key/path; resolved to QINIU_PUBLIC_DOMAIN + path on read. Not a URL, not an asset id.' }
        status: { type: string, description: 'Defaults to "active" when omitted' }
    MembershipTierUpdateRequest:
      type: object
      properties:
        name: { type: string }
        level: { type: integer }
        threshold: { type: integer, format: int64 }
        benefits: { type: string }
        iconAssetId: { type: integer, format: int64 }
        bannerPath: { type: string, description: 'Uploaded VIP banner object key/path; resolved to QINIU_PUBLIC_DOMAIN + path on read. Not a URL, not an asset id.' }
        status: { type: string }
    RechargeProductView:
      type: object
      properties:
        id: { type: integer, format: int64 }
        amountCent: { type: integer, format: int64, description: 'Actual WeChat payment amount in cents' }
        coinAmount: { type: integer, format: int64, description: 'Total coins credited after successful payment' }
        pointsAmount: { type: integer, format: int64, description: 'Points credited after successful payment' }
        couponTemplateId: { type: integer, format: int64, nullable: true, description: 'Published coupon template granted after successful payment' }
        sortOrder: { type: integer }
        status: { type: string }
    RechargeProductCreateRequest:
      type: object
      required: [amountCent, coinAmount]
      properties:
        amountCent: { type: integer, format: int64, description: 'Actual WeChat payment amount in cents' }
        coinAmount: { type: integer, format: int64, description: 'Total coins credited after successful payment' }
        pointsAmount: { type: integer, format: int64, description: 'Points credited after successful payment; defaults to 0' }
        couponTemplateId: { type: integer, format: int64, nullable: true, description: 'Published coupon template to grant; omit for no coupon' }
        sortOrder: { type: integer }
        status: { type: string, description: 'Defaults to "active" when omitted' }
    RechargeProductUpdateRequest:
      type: object
      properties:
        amountCent: { type: integer, format: int64 }
        coinAmount: { type: integer, format: int64 }
        pointsAmount: { type: integer, format: int64 }
        couponTemplateId: { type: integer, format: int64, nullable: true, description: 'Published coupon template to grant; use 0 to clear the binding' }
        sortOrder: { type: integer }
        status: { type: string }
    RankingEntryView:
      type: object
      properties:
        rank: { type: integer, description: '1-based, descending by score' }
        memberId: { type: integer, format: int64 }
        nickname: { type: string }
        avatarUrl: { type: string }
        score: { type: integer, format: int64, description: 'Sum of approved point_savings.points in the window' }
    SignInResult:
      type: object
      description: >
        Result of a daily sign-in. pointsEarned/streakDays reflect the awarded
        rung; a repeat sign-in on the same business day is an idempotent no-op
        that echoes the existing award.
      properties:
        date: { type: string, format: date, description: 'Business-day calendar date (YYYY-MM-DD)' }
        pointsEarned: { type: integer, format: int64 }
        streakDays: { type: integer, description: 'Consecutive-day streak that produced the award' }
        alreadySigned: { type: boolean, description: 'True when today was already recorded and no points were credited again' }
    SignInStatus:
      type: object
      description: Current daily sign-in state and configured reward preview.
      properties:
        date: { type: string, format: date, description: 'Current business-day calendar date (YYYY-MM-DD)' }
        signedToday: { type: boolean }
        streakDays: { type: integer, description: 'Current consecutive-day streak; 0 after a break before signing in again' }
        rewardPoints: { type: integer, format: int64, description: 'Today award when signed, otherwise the award available by signing in now' }
        nextRewardPoints: { type: integer, format: int64, description: 'Reward for the next consecutive day' }
        dailyRewards:
          type: array
          description: 'Global consecutive-day reward ladder; the final value applies to that day and every later day'
          items: { type: integer, format: int64 }
    PointsAmountRequest:
      type: object
      required: [amount, storeId]
      properties:
        amount: { type: integer, format: int64, minimum: 1, description: 'Positive number of points' }
        storeId: { type: integer, format: int64, minimum: 1, description: 'Store the request is scoped to for staff review' }
    PointsTxnResult:
      type: object
      description: >
        A pending point-savings/withdrawal request. No balance moves until the
        store console approves it, so balanceAfter is 0 and status is "pending".
      properties:
        assetType: { type: string, enum: [points] }
        amount: { type: integer, format: int64 }
        balanceAfter: { type: integer, format: int64 }
        requestId: { type: integer, format: int64 }
        status: { type: string, example: pending }
    InvitationView:
      type: object
      description: One member the current member has invited (GET /mini/invitations).
      properties:
        memberId: { type: integer, format: int64 }
        nickname: { type: string }
        avatarUrl: { type: string }
        joinedAt: { type: string, format: date-time, description: 'When the invited member joined' }
    BindInvitationRequest:
      type: object
      required: [inviteCode]
      description: >
        POST /mini/invitations/bind body. inviteCode is the inviter's code; the
        invitee is always the authenticated member, never the body.
      properties:
        inviteCode: { type: string }
    SignInRuleConfig:
      type: object
      description: >
        config_json shape for the sign_in rule. dailyRewards is the reward per
        consecutive day (rung N = day N); a streak past the last rung keeps the
        capped final value (default day 7+ = 700). capReward, when > 0, clamps
        every rung so a misconfigured ladder can never over-award. Every value is
        edited from the admin console, never hard-coded in the client; when no
        enabled sign_in rule exists the server falls back to the 100..700 ladder.
      properties:
        dailyRewards: { type: array, items: { type: integer, format: int64 }, example: [100, 200, 300, 400, 500, 600, 700] }
        capDay: { type: integer, example: 7 }
        capReward: { type: integer, format: int64, example: 700 }
        enabled: { type: boolean }
    RuleDefinitionView:
      type: object
      description: >
        Console representation of a configurable business rule (e.g.
        ruleKey=sign_in). configJson carries the rule's raw config document; for
        sign_in see SignInRuleConfig.
      properties:
        id: { type: integer, format: int64 }
        ruleKey: { type: string, example: sign_in }
        scopeType: { type: string, enum: [global, store], example: global }
        storeId: { type: integer, format: int64 }
        version: { type: integer }
        configJson: { type: object, description: 'Raw rule config; sign_in uses SignInRuleConfig' }
        enabled: { type: boolean }
        status: { type: string, enum: [draft, published, disabled] }
        updatedAt: { type: string, format: date-time }
    RuleDefinitionCreateRequest:
      type: object
      required: [ruleKey, configJson]
      description: >
        New rule versions always land in 'draft' status regardless of enabled;
        publishing is a separate explicit action. scopeType defaults to "global"
        and version to 1 when omitted.
      properties:
        ruleKey: { type: string, example: sign_in }
        scopeType: { type: string, enum: [global, store], default: global }
        storeId: { type: integer, format: int64 }
        version: { type: integer, default: 1 }
        configJson: { type: object, description: 'Raw rule config; sign_in uses SignInRuleConfig' }
        enabled: { type: boolean }
    RuleDefinitionUpdateRequest:
      type: object
      description: >
        Partial update; omitted fields are left unchanged. At least one of
        configJson / enabled / status must be set.
      properties:
        configJson: { type: object }
        enabled: { type: boolean }
        status: { type: string, enum: [draft, published, disabled] }
