    post:
      tags: [mini]
      summary: Redeem a held coupon entitlement
      description: Records a redemption for a member-held entitlement and flips it to `used` in one transaction. Guarded by the Idempotency-Key and the unique redemption index.
      security: [{ bearerAuth: [] }]
