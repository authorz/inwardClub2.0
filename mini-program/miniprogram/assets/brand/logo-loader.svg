<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="126.478 129.911 589.092 258.574">
  <style>
    .logo-letter {
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      stroke-linejoin: round;
      stroke-linecap: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      vector-effect: non-scaling-stroke;
    }
    .logo-outline { animation: logo-cycle 4s linear infinite; }
    .logo-fill {
      fill: #fff;
      opacity: 0;
      animation: logo-fill 4s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }
    .logo-letter-1 { animation: logo-draw-1 4s linear infinite; }
    .logo-letter-2 { animation: logo-draw-2 4s linear infinite; }
    .logo-letter-3 { animation: logo-draw-3 4s linear infinite; }
    .logo-letter-4 { animation: logo-draw-4 4s linear infinite; }
    .logo-letter-5 { animation: logo-draw-5 4s linear infinite; }
    .logo-letter-6 { animation: logo-draw-6 4s linear infinite; }
    @keyframes logo-draw-1 {
      0% { opacity: 1; stroke-dashoffset: 1; }
      12%, 100% { opacity: 1; stroke-dashoffset: 0; }
    }
    @keyframes logo-draw-2 {
      0%, 8% { opacity: 0; stroke-dashoffset: 1; }
      10% { opacity: 1; }
      20%, 100% { opacity: 1; stroke-dashoffset: 0; }
    }
    @keyframes logo-draw-3 {
      0%, 16% { opacity: 0; stroke-dashoffset: 1; }
      18% { opacity: 1; }
      28%, 100% { opacity: 1; stroke-dashoffset: 0; }
    }
    @keyframes logo-draw-4 {
      0%, 24% { opacity: 0; stroke-dashoffset: 1; }
      26% { opacity: 1; }
      36%, 100% { opacity: 1; stroke-dashoffset: 0; }
    }
    @keyframes logo-draw-5 {
      0%, 32% { opacity: 0; stroke-dashoffset: 1; }
      34% { opacity: 1; }
      44%, 100% { opacity: 1; stroke-dashoffset: 0; }
    }
    @keyframes logo-draw-6 {
      0%, 40% { opacity: 0; stroke-dashoffset: 1; }
      42% { opacity: 1; }
      50%, 100% { opacity: 1; stroke-dashoffset: 0; }
    }
    @keyframes logo-fill {
      0%, 50% { opacity: 0; }
      56.25%, 93.75% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes logo-cycle {
      0%, 93.75% { opacity: 1; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo-outline, .logo-fill, .logo-letter { animation: none; opacity: 1; }
      .logo-letter { stroke-dashoffset: 0; }
    }
  </style>
  <defs>
    <path id="logo-1" pathLength="1" transform="matrix(1 0 0 -1 179.3042 129.9115)" d="M0 0C0 0-23.006-22.795-37.359-92.989L-52.826-165.584H-13.131L2.336-92.989C-17.966-60.923 0 0 0 0"/>
    <path id="logo-2" pathLength="1" transform="matrix(1 0 0 -1 239.2158 252.8505)" d="M0 0-9.208 29.95H-48.367L-63.834-42.646H-27.715L-20.474-8.494-10.281-42.646H27.179L42.645 29.95H6.437Z"/>
    <path id="logo-3" pathLength="1" transform="matrix(1 0 0 -1 386.4624 222.90079)" d="M0 0-14.483-33.258-15.288 0H-44.701L-59.632-33.258-59.99 0H-100.042L-94.768-72.595H-54.089L-38.979-41.84-36.924-72.595H3.755L40.053 0Z"/>
    <path id="logo-4" pathLength="1" transform="matrix(1 0 0 -1 470.8584 263.7577)" d="M0 0H-8.404L1.073 24.676ZM-26.464 40.857-59.811-31.738H-18.864L-13.321-16.003H-1.967L-2.951-31.738H38.086L35.672 40.857Z"/>
    <path id="logo-5" pathLength="1" transform="matrix(1 0 0 -1 574.208 244.6254)" d="M0 0C-.418-1.848-1.134-3.16-2.146-3.934-3.16-4.709-4.71-5.097-6.795-5.097H-11.176L-9.03 5.185H-4.649C-2.444 5.185-1.015 4.812-.358 4.068 .297 3.322 .416 1.966 0 0M41.126 4.471C41.78 7.509 41.854 10.132 41.349 12.337 40.842 14.542 39.709 16.331 37.951 17.703 36.192 19.073 33.763 20.085 30.665 20.742 27.565 21.397 23.722 21.725 19.132 21.725H-45.148L-60.616-50.871H-20.921L-14.573-20.921H-10.192C-7.988-20.921-6.558-21.31-5.901-22.083-5.246-22.859-5.128-24.199-5.543-26.105L-10.818-50.871H29.503L33.437-32.185C34.747-25.987 34.42-21.337 32.453-18.239 30.486-15.14 26.731-13.084 21.187-12.069 24.228-11.533 26.88-10.833 29.145-9.968 31.41-9.106 33.348-8.002 34.956-6.66 36.565-5.32 37.862-3.741 38.846-1.922 39.829-.105 40.589 2.026 41.126 4.471"/>
    <path id="logo-6" pathLength="1" transform="matrix(1 0 0 -1 673.3564 244.6254)" d="M0 0-6.169-29.056C-6.587-31.022-7.272-32.38-8.225-33.124-9.179-33.87-10.76-34.243-12.964-34.243H-17.345L-9.029 5.185H-4.648C-2.444 5.185-1.015 4.812-.357 4.068 .297 3.322 .416 1.966 0 0M41.707 13.187C41.2 15.183 40.082 16.808 38.354 18.06 36.625 19.312 34.226 20.235 31.157 20.831 28.087 21.426 24.287 21.725 19.759 21.725H-45.148L-60.616-50.871H-8.551-8.021C12.28-82.937-6.215-143.859-6.215-143.859-6.215-143.859 17.32-121.064 31.674-50.871L41.572 6.08C42.168 8.82 42.213 11.188 41.707 13.187"/>
  </defs>
  <g class="logo-fill">
    <use xlink:href="#logo-1"/><use xlink:href="#logo-2"/><use xlink:href="#logo-3"/><use xlink:href="#logo-4"/><use xlink:href="#logo-5"/>
    <use xlink:href="#logo-6"/>
  </g>
  <g class="logo-outline">
    <use class="logo-letter logo-letter-1" xlink:href="#logo-1"/>
    <use class="logo-letter logo-letter-2" xlink:href="#logo-2"/>
    <use class="logo-letter logo-letter-3" xlink:href="#logo-3"/>
    <use class="logo-letter logo-letter-4" xlink:href="#logo-4"/>
    <use class="logo-letter logo-letter-5" xlink:href="#logo-5"/>
    <use class="logo-letter logo-letter-6" xlink:href="#logo-6"/>
  </g>
</svg>
